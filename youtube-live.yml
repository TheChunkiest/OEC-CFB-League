name: YouTube live check
# Every ~5 minutes, see if the OEC YouTube channel is live and update live.json.
# The site reads live.json to show (or hide) the "We're live" pop-up.
# Best results: add a repo secret named YT_API_KEY (a YouTube Data API v3 key).
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: youtube-live
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Check channel
        id: check
        shell: python
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
        run: |
          import json, os, re, time, urllib.request, urllib.parse
          HANDLE = "@originalentertainingcrackers"
          key = (os.environ.get("YT_API_KEY") or "").strip()

          def via_api():
              def api(path, **q):
                  q["key"] = key
                  url = "https://www.googleapis.com/youtube/v3/" + path + "?" + urllib.parse.urlencode(q)
                  return json.load(urllib.request.urlopen(url, timeout=20))
              ch = api("channels", part="contentDetails", forHandle=HANDLE)["items"][0]
              uploads = ch["contentDetails"]["relatedPlaylists"]["uploads"]
              items = api("playlistItems", part="contentDetails", playlistId=uploads, maxResults=10)["items"]
              ids = [i["contentDetails"]["videoId"] for i in items]
              vids = api("videos", part="snippet", id=",".join(ids))["items"] if ids else []
              for v in vids:
                  if v["snippet"].get("liveBroadcastContent") == "live":
                      return {"live": True, "videoId": v["id"], "url": "https://www.youtube.com/watch?v=" + v["id"], "title": v["snippet"]["title"]}
              return {"live": False}

          def via_page():
              req = urllib.request.Request("https://www.youtube.com/" + HANDLE + "/live", headers={
                  "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124 Safari/537.36",
                  "Accept-Language": "en-US,en;q=0.9", "Cookie": "CONSENT=YES+1; SOCS=CAI"})
              html = urllib.request.urlopen(req, timeout=20).read().decode("utf-8", "ignore")
              t = re.search(r"<title>(.*?)</title>", html, re.S)
              print("Page title:", t.group(1).strip() if t else "?", "| bot check:", "not a bot" in html)
              vid = re.search(r'<link rel="canonical" href="https://www\.youtube\.com/watch\?v=([\w-]{11})"', html)
              live = vid is not None and ('"isLiveNow":true' in html or '"isLive":true' in html)
              if not live:
                  return {"live": False}
              title = re.search(r'<meta name="title" content="([^"]*)"', html)
              return {"live": True, "videoId": vid.group(1), "url": "https://www.youtube.com/watch?v=" + vid.group(1),
                      "title": (title.group(1) if title else "Live on YouTube").replace("&amp;", "&").replace("&#39;", "'").replace("&quot;", '"')}

          try:
              new = via_api() if key else via_page()
              print("Method:", "YouTube API" if key else "page check (add YT_API_KEY secret for reliability)")
          except Exception as e:
              print("Check failed, leaving live.json alone:", e); raise SystemExit(0)
          old = {}
          if os.path.exists("live.json"):
              try: old = json.load(open("live.json"))
              except Exception: pass
          # While live, re-stamp checkedAt every run so the site knows the status is fresh;
          # the site ignores a "live" status that hasn't been confirmed in 25 minutes.
          if new["live"]:
              new["checkedAt"] = int(time.time() * 1000)
          elif old.get("live") is False or (not old.get("live") and "live" in old):
              print("No change:", new); raise SystemExit(0)
          json.dump(new, open("live.json", "w"), indent=1)
          open(os.environ["GITHUB_OUTPUT"], "a").write("changed=true\n")
          print("Updated:", new)
      - name: Save
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name "oec-live-bot"
          git config user.email "actions@users.noreply.github.com"
          git add live.json
          git commit -m "YouTube live status update"
          git push
