<body class="hub">
<!-- Loading screen: a play clock and a football moving down the field while the league loads; it leaves with a
     "tunnel run-out" (the logo rushes forward as the screen clears). -->
<div id="splash" aria-hidden="true">
  <img src="logo.png" class="sp-logo" alt="">
  <div class="sp-clockwrap"><div class="sp-lbl">PLAY CLOCK</div><div class="sp-clock" id="spClock">:40</div></div>
  <div class="sp-field"><i class="sp-ball"></i></div>
  <div class="sp-yards"><span>G</span><span>10</span><span>20</span><span>30</span><span>40</span><span>50</span><span>40</span><span>30</span><span>20</span><span>10</span><span>G</span></div>
  <div class="sp-status">LOADING THE LEAGUE</div>
</div>
<header class="hero">
  <div class="hero-in">
    <a href="#home"><img src="logo.png" class="logo" alt="OEC — Original Entertaining Crackers"></a>
    <div class="titleblock">
      <div class="brand"><span>OEC</span> CFB League Hub</div>
      <div class="sub" id="sub">College Football 27 Online Dynasty</div>
    </div>
    <div class="hdr-right">
      <div class="badges">
        <div class="badge"><span id="bSeasonLbl">Season</span><b id="bSeason">—</b></div>
        <div class="badge gold"><span id="bWeekLbl">Current Week</span><b id="bWeek">—</b></div>
        <div class="badge adv" id="bAdv" hidden><span>Next advance</span><b id="bAdvT">—</b></div>
      </div>
      <div class="acct" id="acct"></div>
    </div>
  </div>
</header>
<div class="pagehead" id="pagehead" hidden><h1 id="pageTitle"></h1><p id="pageSub"></p><div id="subnav" class="subtabs" role="tablist"></div></div>
<main id="view"><p class="muted">Loading…</p></main>
