name: YouTube live check
# Checks whether the OEC YouTube channel is live about once a minute and updates live.json.
# GitHub only starts scheduled workflows every 5 minutes (at best), so each run checks
# 5 times, a minute apart. The site reads live.json every minute to show the pop-up.
# Best results: add a repo secret named YT_API_KEY (a YouTube Data API v3 key).
# When the channel goes live it also sends a phone notification right away (if the FIREBASE_SERVICE_ACCOUNT
# secret is set) to every device with "OEC goes live on YouTube" turned on. One notification per stream.
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: youtube-live
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v5
      - name: Notification tools
        if: env.SA != ''
        run: python3 -m pip install -q --break-system-packages google-auth || python3 -m pip install -q google-auth
      - name: Check channel
        id: check
        shell: python
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
        run: |
          import json, os, re, time, urllib.request, urllib.parse, urllib.error
          HANDLE = "@originalentertainingcrackers"
          key = (os.environ.get("YT_API_KEY") or "").strip()

          def via_api():
              def api(path, **q):
                  q["key"] = key
                  url = "https://www.googleapis.com/youtube/v3/" + path + "?" + urllib.parse.urlencode(q)
                  return json.load(urllib.request.urlopen(url, timeout=20))
              ch = api("channels", part="contentDetails", forHandle=HANDLE)["items"][0]
              uploads = ch["contentDetails"]["relatedPlaylists"]["uploads"]
              items = api("playlistItems", part="contentDetails", playlistId=uploads, maxResults=10)["items"]
              ids = [i["contentDetails"]["videoId"] for i in items]
              vids = api("videos", part="snippet", id=",".join(ids))["items"] if ids else []
              # Every stream that's live right now (two games can stream at once), oldest first.
              on = sorted([v for v in vids if v["snippet"].get("liveBroadcastContent") == "live"], key=lambda v: v["snippet"].get("publishedAt", ""))
              if not on:
                  return {"live": False}
              streams = [{"videoId": v["id"], "url": "https://www.youtube.com/watch?v=" + v["id"], "title": v["snippet"]["title"]} for v in on]
              return {"live": True, **streams[0], "streams": streams}

          def via_page():
              req = urllib.request.Request("https://www.youtube.com/" + HANDLE + "/live", headers={
                  "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124 Safari/537.36",
                  "Accept-Language": "en-US,en;q=0.9", "Cookie": "CONSENT=YES+1; SOCS=CAI"})
              html = urllib.request.urlopen(req, timeout=20).read().decode("utf-8", "ignore")
              t = re.search(r"<title>(.*?)</title>", html, re.S)
              print("Page title:", t.group(1).strip() if t else "?", "| bot check:", "not a bot" in html)
              vid = re.search(r'<link rel="canonical" href="https://www\.youtube\.com/watch\?v=([\w-]{11})"', html)
              live = vid is not None and ('"isLiveNow":true' in html or '"isLive":true' in html)
              if not live:
                  return {"live": False}
              title = re.search(r'<meta name="title" content="([^"]*)"', html)
              one = {"videoId": vid.group(1), "url": "https://www.youtube.com/watch?v=" + vid.group(1),
                     "title": (title.group(1) if title else "Live on YouTube").replace("&amp;", "&").replace("&#39;", "'").replace("&quot;", '"')}
              return {"live": True, **one, "streams": [one]}

          import subprocess
          def git(*a): return subprocess.run(["git", *a], check=False, capture_output=True, text=True)
          git("config", "user.name", "oec-live-bot"); git("config", "user.email", "actions@users.noreply.github.com")

          def save(data, why):
              json.dump(data, open("live.json", "w"), indent=1)
              git("add", "live.json")
              if git("diff", "--cached", "--quiet").returncode == 0: return
              git("commit", "-m", "YouTube live status: " + why)
              for _ in range(3):
                  if git("push").returncode == 0: print("Pushed:", why); return
                  git("pull", "--rebase", "-X", "theirs")
              print("Push failed")

          # Phone notification when a stream starts (free Firebase Cloud Messaging; reads the device list only then).
          def notify_live(v, another=False):
              if not os.environ.get("SA"): return
              try:
                  from google.oauth2 import service_account
                  from google.auth.transport.requests import Request
                  cfg = open("firebase-config.js").read()
                  pid = re.search(r'projectId\s*:\s*["\']([^"\']+)', cfg).group(1)
                  base = f"https://firestore.googleapis.com/v1/projects/{pid}/databases/(default)/documents"
                  creds = service_account.Credentials.from_service_account_info(json.loads(os.environ["SA"]),
                      scopes=["https://www.googleapis.com/auth/firebase.messaging", "https://www.googleapis.com/auth/datastore"])
                  creds.refresh(Request())
                  H = {"Authorization": f"Bearer {creds.token}", "Content-Type": "application/json"}
                  def call(url, body=None, method=None):
                      rq = urllib.request.Request(url, data=json.dumps(body).encode() if body is not None else None, headers=H, method=method)
                      with urllib.request.urlopen(rq, timeout=30) as r: return json.load(r)
                  devs, tok = [], ""
                  while True:
                      d = call(f"{base}/push?pageSize=300" + (f"&pageToken={tok}" if tok else ""))
                      devs += d.get("documents", []); tok = d.get("nextPageToken")
                      if not tok: break
                  sent = 0
                  for x in devs:
                      f = x.get("fields", {}); prefs = f.get("prefs", {}).get("mapValue", {}).get("fields", {})
                      if not prefs.get("live", {}).get("booleanValue", True): continue   # on unless turned off
                      token = f.get("token", {}).get("stringValue")
                      if not token: continue
                      msg = {"message": {"token": token, "data": {"title": "🔴 Another OEC stream is live" if another else "🔴 OEC is live on YouTube", "body": v.get("title") or "Tap to watch.", "link": v.get("url") or "https://youtube.com/@originalentertainingcrackers", "tag": "live-" + (v.get("videoId") or "")},
                             "webpush": {"headers": {"Urgency": "high", "TTL": "3600"}}}}
                      try: call(f"https://fcm.googleapis.com/v1/projects/{pid}/messages:send", msg); sent += 1
                      except urllib.error.HTTPError as e:
                          err = e.read().decode(errors="ignore")
                          if e.code == 404 or "UNREGISTERED" in err:
                              try: call("https://firestore.googleapis.com/v1/" + x["name"], method="DELETE")
                              except Exception: pass
                          else: print("send failed", e.code, err[:200])
                  print(f"Live notification sent to {sent} device(s)")
              except Exception as e:
                  print("Live notification skipped:", repr(e)[:300])

          CHECKS, GAP = 5, 60
          for i in range(CHECKS):
              t0 = time.time()
              try:
                  new = via_api() if key else via_page()
              except Exception as e:
                  print(f"[{i+1}/{CHECKS}] check failed:", e); new = None
              if new is not None:
                  old = {}
                  if os.path.exists("live.json"):
                      try: old = json.load(open("live.json"))
                      except Exception: pass
                  now = int(time.time() * 1000)
                  # One notification per stream, even with two streams going at once (notifiedIds remembers them).
                  done_ids = list(old.get("notifiedIds") or ([old["notified"]] if old.get("notified") else []))
                  ids = lambda d: [x["videoId"] for x in (d.get("streams") or ([d] if d.get("videoId") else []))]
                  if new["live"]:
                      # Commit when going live (or the set of streams changes); while still live, re-stamp
                      # checkedAt about every 5 minutes so the site knows it's fresh (it ignores a
                      # "live" status not confirmed in 25 minutes) without a commit every minute.
                      new["notified"], new["notifiedIds"] = old.get("notified"), done_ids
                      if not old.get("live") or sorted(ids(old)) != sorted(ids(new)):
                          new["checkedAt"] = now; save(new, "live" if len(ids(new)) == 1 else f"{len(ids(new))} streams live")
                          fresh = [x for x in new["streams"] if x["videoId"] not in done_ids]
                          for k, x in enumerate(fresh):
                              notify_live(x, another=bool(old.get("live")) or k > 0)
                              done_ids.append(x["videoId"]); new["notified"] = x["videoId"]
                          if fresh:
                              new["notifiedIds"] = done_ids[-10:]; save(new, "notified")
                      elif now - int(old.get("checkedAt") or 0) > 4.5 * 60e3:
                          new["checkedAt"] = now; save(new, "still live")
                      else: print(f"[{i+1}/{CHECKS}] still live")
                  elif old.get("live") or "live" not in old:
                      save({"live": False, "notified": old.get("notified"), "notifiedIds": done_ids[-10:]}, "offline")
                  else: print(f"[{i+1}/{CHECKS}] not live")
              if i < CHECKS - 1: time.sleep(max(0, GAP - (time.time() - t0)))
