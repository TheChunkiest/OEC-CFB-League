name: Game moments
# Finds big plays and key moments in each game's YouTube broadcast with Google Gemini and saves them to
# moments.json for the game recaps (.github/moments.py). One game per run, newest finals first.
# Needs the GEMINI_API_KEY secret (free key from Google AI Studio). Without it, this does nothing.
on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: game-moments
  cancel-in-progress: false
jobs:
  moments:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Find key moments
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
        run: python3 .github/moments.py
      - name: Save
        run: |
          git config user.name "oec-hub-bot"
          git config user.email "actions@users.noreply.github.com"
          git add moments.json 2>/dev/null || true
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Update game moments"
          for i in 1 2 3 4; do git push && exit 0; sleep 5; git pull --rebase -X theirs; done
          exit 1
